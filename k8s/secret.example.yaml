# Valores fictícios para o cluster local. Não use em produção e não troque por segredo real neste arquivo.
# SUPABASE_SECRET_KEY fica de fora de propósito: sem ela, GET /health não consulta o banco.
apiVersion: v1
kind: Secret
metadata:
  name: shopwag-backend-secret
  labels:
    app: shopwag-backend
type: Opaque
stringData:
  MP_CLIENT_ID: "exemplo-client-id"
  MP_CLIENT_SECRET: "exemplo-client-secret"
  MP_WEBHOOK_SECRET: "exemplo-webhook-secret"
  MP_TOKEN_SECRET: "exemplo-token-secret-local"
  MP_PLATFORM_USER_ID: "000000000"
  VERCEL_TOKEN: "exemplo-vercel-token"
  VERCEL_PROJECT_ID: "prj_exemplo"
  VERCEL_TEAM_ID: "team_exemplo"
